<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf1e6">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kupé">
  <title>Kupé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- vintage steam locomotive, reused as icon + hero -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="loco" viewBox="0 0 120 64">
      <g fill="currentColor">
        <circle cx="38" cy="9" r="4" opacity=".25"/>
        <circle cx="30" cy="4" r="3" opacity=".15"/>
        <path d="M34 20h10l2-8h-14z"/>
        <rect x="32" y="9" width="16" height="3" rx="1.5"/>
        <rect x="26" y="22" width="58" height="20" rx="10"/>
        <path d="M56 22a6 6 0 0 1 12 0z"/>
        <rect x="82" y="14" width="26" height="28" rx="2"/>
        <rect x="79" y="10" width="32" height="5" rx="2"/>
        <rect x="24" y="41" width="86" height="4" rx="1"/>
        <path d="M26 42l-10 10h10z"/>
        <circle cx="38" cy="51" r="6"/>
        <circle cx="62" cy="49" r="9"/>
        <circle cx="90" cy="49" r="9"/>
      </g>
      <g fill="#fff">
        <rect x="88" y="19" width="14" height="11" rx="1.5"/>
        <circle cx="62" cy="49" r="3"/>
        <circle cx="90" cy="49" r="3"/>
        <circle cx="38" cy="51" r="2"/>
      </g>
      <path d="M62 49h28" stroke="#fff" stroke-width="1.6"/>
    </symbol>
  </svg>

  <div id="app">
    <header>
      <button id="menu" aria-label="Journeys">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <h1 class="wordmark">Kup<span class="e">é</span></h1>
      <svg class="mini-loco" width="34" height="18"><use href="#loco"/></svg>
    </header>
    <div class="track" aria-hidden="true"></div>

    <div id="messages"></div>

    <form id="composer">
      <input id="text" placeholder="Where to next?" autocomplete="off" enterkeyhint="send">
      <button id="send" aria-label="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </div>

  <div id="scrim"></div>
  <aside id="drawer">
    <div class="drawer-head">
      <span class="wordmark small">Journeys</span>
      <svg width="46" height="24"><use href="#loco"/></svg>
    </div>
    <button id="new-chat">+ New journey</button>
    <ul id="chat-list"></ul>
  </aside>

  <template id="hero">
    <div class="hero">
      <svg class="hero-loco" viewBox="0 0 120 64"><use href="#loco"/></svg>
      <div class="hero-rail"></div>
      <p>All aboard.<br>Tell Kup<span class="e">é</span> where you’d like to go.</p>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
